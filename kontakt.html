<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-darkText font-sans">
  <header class="text-center py-8 border-b border-gray-200">
    <h1 class="text-3xl font-semibold">Kontakt</h1>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <h2 class="text-2xl font-semibold mb-6">So erreichst du uns</h2>
    <p class="text-gray-600 text-lg mb-6">Du hast Fragen oder Wünsche? Schreib uns eine Nachricht oder ruf uns an! Wir freuen uns auf deine Anfrage.</p>

    <form class="bg-light p-8 rounded-lg shadow-sm border border-gray-200">
      <div class="mb-4">
        <label for="name" class="block text-sm font-semibold mb-2">Dein Name</label>
        <input type="text" id="name" class="w-full p-3 rounded-lg border border-gray-300" required>
      </div>

      <div class="mb-4">
        <label for="email" class="block text-sm font-semibold mb-2">Deine E-Mail-Adresse</label>
        <input type="email" id="email" class="w-full p-3 rounded-lg border border-gray-300" required>
      </div>

      <div class="mb-6">
        <label for="message" class="block text-sm font-semibold mb-2">Nachricht</label>
        <textarea id="message" class="w-full p-3 rounded-lg border border-gray-300" rows="4" required></textarea>
      </div>

      <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg hover:bg-blue-600">Absenden</button>
    </form>
  </main>

  <footer class="text-center text-sm text-gray-400 mt-12 py-6 border-t border-gray-100">
    <a href="index.html" class="text-primary hover:underline">← Zurück zur Startseite</a>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-darkText font-sans">
  <header class="text-center py-8 border-b border-gray-200">
    <h1 class="text-3xl font-semibold">Shop</h1>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">
    <h2 class="text-2xl font-semibold mb-6">Unsere Produkte</h2>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="bg-light p-5 rounded-lg border border-gray-200 shadow-sm">
        <h3 class="font-semibold mb-1">Grafikkarte XYZ</h3>
        <p class="text-gray-600 text-sm">Leistungsstarke GPU für Gaming und mehr.</p>
        <p class="text-lg font-semibold">€299,99</p>
      </div>
      <div class="bg-light p-5 rounded-lg border border-gray-200 shadow-sm">
        <h3 class="font-semibold mb-1">SSD 1TB</h3>
        <p class="text-gray-600 text-sm">Schnelle SSD für schnelle Ladezeiten.</p>
        <p class="text-lg font-semibold">€119,99</p>
      </div>
      <div class="bg-light p-5 rounded-lg border border-gray-200 shadow-sm">
        <h3 class="font-semibold mb-1">Retro Game Console</h3>
        <p class="text-gray-600 text-sm">Mit über 100 klassischen Spielen vorinstalliert.</p>
        <p class="text-lg font-semibold">€129,99</p>
      </div>
    </div>
  </main>

  <footer class="text-center text-sm text-gray-400 mt-12 py-6 border-t border-gray-100">
    <a href="index.html" class="text-primary hover:underline">← Zurück zur Startseite</a>
  </footer>
</body>
</html>

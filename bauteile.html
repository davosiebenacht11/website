<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC-Bauteile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-darkText font-sans">
  <header class="text-center py-8 border-b border-gray-200">
    <h1 class="text-3xl font-semibold">PC-Bauteile</h1>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10 grid gap-6">
    <div class="bg-light p-5 rounded-lg border border-gray-200 shadow-sm">
      <h3 class="font-semibold mb-1">Grafikkarten</h3>
      <p class="text-gray-600 text-sm">Leistungsstarke GPUs für Gaming und Workstations.</p>
    </div>
    <div class="bg-light p-5 rounded-lg border border-gray-200 shadow-sm">
      <h3 class="font-semibold mb-1">SSDs & Speicher</h3>
      <p class="text-gray-600 text-sm">Schnelle Speicherlösungen für jede Anwendung.</p>
    </div>
    <div class="bg-light p-5 rounded-lg border border-gray-200 shadow-sm">
      <h3 class="font-semibold mb-1">Mainboards</h3>
      <p class="text-gray-600 text-sm">Kompatible Boards für Intel & AMD Plattformen.</p>
    </div>
    <div class="bg-light p-5 rounded-lg border border-gray-200 shadow-sm">
      <h3 class="font-semibold mb-1">Netzteile & Kühlung</h3>
      <p class="text-gray-600 text-sm">Stabile Energieversorgung und effiziente Kühlung.</p>
    </div>
  </main>

  <footer class="text-center text-sm text-gray-400 mt-12 py-6 border-t border-gray-100">
    <a href="index.html" class="text-primary hover:underline">← Zurück zur Startseite</a>
  </footer>
</body>
</html>
